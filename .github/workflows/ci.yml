name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # The rolling job resolves the current Pi release afresh, so host drift has to be caught
  # without waiting for a push: a Pi release that breaks these extensions would otherwise
  # stay invisible until the next commit. Schedules only run on the default branch.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - name: Typecheck extensions
        run: npm run typecheck
      - run: npm test
      - name: Audit nested extension deps
        run: |
          cd extensions/opl-browser && npm audit --omit=dev --audit-level=high
          cd ../opl-webaccess && npm audit --omit=dev --audit-level=high

  # Rolling 1.5.x compatibility is separate from the reproducible lockfile and floor jobs.
  # Resolve the tilde range afresh, report all three versions, and require the loader to
  # use that devDependency rather than a managed install on the runner.
  current:
    runs-on: ubuntu-latest
    env:
      PI_CODING_AGENT_DIR: /tmp/opl-current-agent
      PI_MANAGED_INSTALL_ROOT: /tmp/opl-no-managed-install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - name: Resolve current Pi 1.5.x
        run: >
          npm install --no-save --package-lock=false --no-audit --no-fund
          '@earendil-works/pi-coding-agent@~1.5.0'
          '@earendil-works/pi-tui@~1.5.0'
          '@earendil-works/pi-ai@~1.5.0'
      - name: Report resolved versions and require the selected host
        run: |
          npm ls --depth=0 @earendil-works/pi-coding-agent @earendil-works/pi-tui @earendil-works/pi-ai
          version=$(node -p "require('./node_modules/@earendil-works/pi-coding-agent/package.json').version")
          echo "OPL_PI_HOST_SOURCE=devDependency pi $version" >> "$GITHUB_ENV"
          node - "$version" <<'NODE'
          const { createRequire } = require("node:module");
          const { appendFileSync } = require("node:fs");
          const req = createRequire(process.cwd() + "/");
          const [version] = process.argv.slice(2);
          // The oldest release this collection is verified against; raise it together with the
          // documented validation note, never above what the suite has actually been run on.
          const MINIMUM = [1, 5, 1];
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            console.error(`Rolling job resolved pi-coding-agent "${version}"; expected a stable x.y.z release.`);
            process.exit(1);
          }
          const got = version.split(".").map(Number);
          const older = got.reduce((cmp, _part, i) => (cmp !== 0 ? cmp : (got[i] ?? 0) - MINIMUM[i]), 0) < 0;
          if (older) {
            console.error(`Rolling job resolved pi-coding-agent ${version}, expected >= ${MINIMUM.join(".")}.`);
            console.error("Either the tilde range stopped tracking the verified release or the registry rolled back.");
            process.exit(1);
          }
          const rows = ["pi-coding-agent", "pi-tui", "pi-ai"]
            .map((name) => `- ${name}: ${req(`./node_modules/@earendil-works/${name}/package.json`).version}`)
            .join("\n");
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Resolved Pi host (requirement >= ${MINIMUM.join(".")})\n${rows}\n`);
          NODE
      - name: Typecheck against current Pi
        run: npm run typecheck
      - name: Test against current Pi
        run: npm test

  # The package declares a floor of pi >=0.87.0. This job pins all three host packages to that
  # floor and runs the same suite there, so the floor is exercised instead of only asserted.
  # The machine's managed pi install must not leak in: without the neutralisation below,
  # tests/pi-host-loader.test.mjs prefers it and the floor never runs. OPL_PI_HOST_SOURCE makes
  # that preference a hard failure rather than a silently greener job.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - name: Pin the declared floor
        run: >
          npm install --no-save --no-audit --no-fund
          @earendil-works/pi-coding-agent@0.87.0
          @earendil-works/pi-tui@0.87.0
          @earendil-works/pi-ai@0.87.0
          typebox@1.3.27
      - name: Typecheck at the floor
        run: npm run typecheck
        env:
          PI_CODING_AGENT_DIR: /tmp/no-agent-dir
          PI_MANAGED_INSTALL_ROOT: /tmp/no-install-root
      - name: Test at the floor
        run: npm test
        env:
          PI_CODING_AGENT_DIR: /tmp/no-agent-dir
          PI_MANAGED_INSTALL_ROOT: /tmp/no-install-root
          OPL_PI_HOST_SOURCE: devDependency pi 0.87.0
