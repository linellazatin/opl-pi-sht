name: Release

on:
  push:
    tags:
      - "v*"

# Only the publish job needs write access. validate.yml declares `contents: read` itself, so a
# called run cannot inherit the token scopes below.
permissions:
  contents: read

# Two tags in flight would race `npm publish` for the same version.
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  # The gate: the whole suite, on the tagged commit. A tag can point at a commit that never
  # sat on main, and validate.yml does not trigger on tags, so this is the only run that
  # proves the commit being published.
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Validate release version
        run: |
          node -e 'const version = require("./package.json").version; if (process.env.GITHUB_REF_NAME !== `v${version}`) { console.error("Release tag must match package.json version"); process.exit(1); }'
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - run: npm install -g npm@latest
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ''
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}